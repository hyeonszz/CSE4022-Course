services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    # 팀 서버처럼 여러 명이 같이 쓰는 서버에서는 HOST_PORT / CONTAINER_NAME을 넘겨서 충돌 방지
    container_name: ${CONTAINER_NAME:-FastApi-app}
    ports:
      - "${HOST_PORT:-5001}:8000"
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
    environment:
      - PYTHONUNBUFFERED=1        # 로그를 버퍼링 없이 바로 stdout으로 출력 (Alloy가 수집)

  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter
    profiles: ["loadtest"]                      # 평소 up 에는 뜨지 않음: docker compose --profile loadtest run --rm jmeter
    depends_on:
      - fastapi-app
    volumes:
      - ./jmeter:/jmeter
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /jmeter/results.jtl
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -Jjmeter.save.saveservice.output_format=csv
      - -e
      - -o
      - /jmeter/report

  influxdb:
    image: influxdb:1.8.10                      # JMeter Backend Listener(v1 write API)용 시계열 DB, 버전 고정
    container_name: influxdb
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=jmeter                      # 시작 시 jmeter DB 자동 생성
      - INFLUXDB_HTTP_LOG_ENABLED=false
    ports:
      # 인증 없는 DB 라서 외부 노출 금지. docker0 브릿지(172.17.0.1)에만 열어
      # Jenkins 가 띄우는 JMeter 컨테이너는 접근하고, 외부 네트워크는 막는다. (Grafana 는 compose 내부에서 influxdb:8086 로 접근)
      - "172.17.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # ← 추가: 볼륨을 컨테이너 경로에 마운트
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # ← 추가: /tmp를 쓰기 가능하게
      - /tmp

  prometheus:
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6      # 버전 고정 (v0.53.0부터 이미지 위치가 ghcr.io)
    container_name: cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # ports 없음: Prometheus가 내부 네트워크(cadvisor:8080)로 수집 (화면에 로그인 기능이 없음)
    volumes:                                    # 컨테이너 정보를 읽기 위한 호스트 경로 (모두 읽기 전용)
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  loki:                                         # 로그 저장소
    image: grafana/loki:3.7.9                   # 버전 고정
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml   # 이미지 기본 설정 (TSDB + schema v13)
    ports:
      - "127.0.0.1:3100:3100"                   # 외부 노출 금지 (인증 없음)
    volumes:
      - loki-data:/loki

  alloy:                                        # 로그 수집기 (Promtail 대체)
    image: grafana/alloy:v1.21.3                # 버전 고정 (Alloy 태그는 앞에 v가 붙음)
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"                 # Alloy UI. 외부 노출 금지 (로그인 기능 없음)
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 컨테이너 목록·로그를 읽는 통로
      - alloy-data:/var/lib/alloy/data                 # 어디까지 읽었는지(positions) 저장
    depends_on:
      - loki

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  prometheus-data:
  grafana-data:
  influxdb-data:
  loki-data:
  alloy-data:
